name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-13
            arch: x86_64
          - os: macos-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Configure (debug)
        run: xmake config -y --mode=debug --toolchain=clang

      - name: Build
        run: xmake -v

      - name: Configure (test)
        run: xmake config -y --mode=test --toolchain=clang

      - name: Test
        run: xmake test

  build-windows-msys2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            arch: x86_64
            msystem: MINGW64
            packages: mingw-w64-x86_64-clang mingw-w64-x86_64-lld
          - runs-on: windows-11-arm
            arch: arm64
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-lld

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (${{ matrix.msystem }} + clang)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure (debug)
        run: xmake config -y --mode=debug --toolchain=clang

      - name: Build
        run: xmake -v

      - name: Configure (test)
        run: xmake config -y --mode=test --toolchain=clang

      - name: Test
        run: xmake test
